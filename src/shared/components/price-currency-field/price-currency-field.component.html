<div class="price-currency-field">
  @if (label()) {
    <label [for]="amountName()" class="label">{{ label() }}{{ required() ? '&#42;' : '' }}</label>
  }
  <div class="row">
    <input
      pInputText
      type="text"
      inputmode="decimal"
      enterkeyhint="done"
      autocomplete="off"
      [id]="amountName()"
      [name]="amountName()"
      [ngModel]="amountStr()"
      (ngModelChange)="onAmountStringChange($event)"
      (focus)="onAmountFocus()"
      (blur)="onAmountBlur()"
      [required]="required()"
      class="amount-input"
    />
    @if (lockCurrency()) {
      <span class="currency-locked">{{ currencyCodeValue }}</span>
    } @else if (showCurrency()) {
      <p-select
        [ngModel]="currencyCodeValue"
        (ngModelChange)="currencyCodeValue = $event"
        [options]="currencies"
        optionLabel="label"
        optionValue="code"
        placeholder="Currency"
        appendTo="body"
        styleClass="currency-select"
      />
    }
  </div>
</div>
