<div class="price-currency-field">
  @if (label()) {
    <label [for]="amountName()" class="label">{{ label() }}{{ required() ? '&#42;' : '' }}</label>
  }
  <div class="row">
    <p-inputNumber
      [inputId]="amountName()"
      [name]="amountName()"
      [(ngModel)]="amount"
      (blur)="onAmountBlur()"
      [min]="0"
      mode="decimal"
      [minFractionDigits]="0"
      [maxFractionDigits]="2"
      [useGrouping]="false"
      class="amount-input"
    />
    @if (showCurrency()) {
      <p-select
        [ngModel]="currencyCodeValue"
        (ngModelChange)="currencyCodeValue = $event"
        [options]="currencies"
        optionLabel="label"
        optionValue="code"
        placeholder="Currency"
        appendTo="body"
        styleClass="currency-select"
      />
    }
  </div>
</div>
