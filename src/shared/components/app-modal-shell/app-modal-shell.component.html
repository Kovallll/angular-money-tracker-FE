<div class="app-modal-shell" [class.app-modal-shell--embedded]="embedded()">
  @if (title()) {
    <header class="app-modal-shell__header">
      <h2 class="app-modal-shell__title">{{ title() }}</h2>
      @if (showCloseButton()) {
        <button
          type="button"
          class="app-modal-shell__close"
          (click)="closeRequest.emit()"
          aria-label="Close"
        >
          <i class="pi pi-times"></i>
        </button>
      }
    </header>
  }
  <div class="app-modal-shell__content">
    <ng-content />
  </div>
  @if (hasActions()) {
    <footer class="app-modal-shell__footer">
      @if (showDelete()) {
        <app-button appearance="danger" size="md" (buttonClick)="deleteRequest.emit()">
          <i class="pi pi-trash"></i>
          {{ deleteLabel() }}
        </app-button>
      }
      <span class="app-modal-shell__spacer"></span>
      @if (showCancel()) {
        <app-button appearance="secondary" size="md" (buttonClick)="cancelRequest.emit()">
          <i class="pi pi-times"></i>
          {{ cancelLabel() }}
        </app-button>
      }
      @if (showSave()) {
        <app-button
          appearance="primary"
          size="md"
          [disabled]="saveDisabled()"
          [loading]="saveLoading()"
          (buttonClick)="saveRequest.emit()"
        >
          <i class="pi pi-check"></i>
          {{ saveLabel() }}
        </app-button>
      }
    </footer>
  }
</div>
