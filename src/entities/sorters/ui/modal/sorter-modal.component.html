<app-modal-shell
  title="Sort by"
  [showCloseButton]="true"
  [showCancel]="true"
  [showSave]="true"
  saveLabel="Apply"
  (closeRequest)="closeModal()"
  (cancelRequest)="closeModal()"
  (saveRequest)="applySorter()"
>
  <div class="content">
    <div class="selectors">
      <select-component
        [options]="data.categoryOptions()"
        [value]="sorter().field"
        (valueChange)="onCategoryChange($event)"
      />
      <div class="sort-buttons">
        <button
          mat-button
          class="sort-button"
          [class.active]="isAscending()"
          (click)="onChangeOrder(true)"
        >
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
        <button
          mat-button
          class="sort-button"
          [class.active]="!isAscending()"
          (click)="onChangeOrder(false)"
        >
          <mat-icon>keyboard_arrow_up</mat-icon>
        </button>
      </div>
    </div>
    <div class="bottom-block">
      <button mat-button class="clear-sorters" (click)="clearSorter()">
        <mat-icon>close</mat-icon>Clear Sorters
      </button>
    </div>
  </div>
</app-modal-shell>
