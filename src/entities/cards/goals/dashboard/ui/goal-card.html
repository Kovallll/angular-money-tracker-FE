<dashboard-card title="Goals" [isWithSeeAll]="true" [seeAllPath]="seeAllPath">
  <card-body class="body">
    @if (isLoading()) {
    <div class="data-loading">
      <p-progress-spinner ariaLabel="Loading" />
    </div>
    } @else if (goals().length) {
    <p-carousel
      [value]="goals()"
      [numVisible]="1"
      [numScroll]="1"
      [responsiveOptions]="carouselResponsive"
      [showNavigators]="goals().length > 1"
      [showIndicators]="goals().length > 1"
      styleClass="dashboard-carousel"
    >
      <ng-template #item let-goal>
        <div class="carousel-slide">
          <goal-card-item [item]="goal" />
        </div>
      </ng-template>
    </p-carousel>
    } @else {
    <div class="data-placeholder">
      <span class="data-placeholder__icon" aria-hidden="true">🎯</span>
      <p>No goals</p>
      <p>Create a goal on the Goals page</p>
    </div>
    }
  </card-body>
</dashboard-card>
