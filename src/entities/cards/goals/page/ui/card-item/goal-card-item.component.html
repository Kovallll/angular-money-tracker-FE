<dashboard-card>
  <card-body class="card">
    <div class="left-side">
      <span class="card-icon" aria-hidden="true"><i class="pi pi-flag"></i></span>
      <div class="text-block">
        <p class="text">{{ goal().title }}</p>
        <p class="price">{{ goal().goalBudget | appCurrencyPrimary: goal().currencyCode }}</p>
      </div>
    </div>
    <div class="right-side">
      <goal-adjust-card-button [goal]="goal()" />
    </div>
  </card-body>
</dashboard-card>
