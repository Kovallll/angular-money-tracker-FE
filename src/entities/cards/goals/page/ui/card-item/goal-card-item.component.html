<dashboard-card>
  <card-body class="card">
    <div class="left-side">
      <span class="card-icon" aria-hidden="true"><i class="pi pi-flag"></i></span>
      <div class="text-block">
        <p class="text">{{ goal().title }}</p>
        <p class="price">{{ goal().goalBudget | appCurrencyPrimary: goal().currencyCode }}</p>
      </div>
    </div>
    <div class="right-side">
      <span class="progress-badge" [class.progress-badge--full]="getProgress(goal()) >= 100">
        {{ getProgress(goal()) | number: '1.0-0' }}%
      </span>
    </div>
  </card-body>
</dashboard-card>
