<dashboard-card title="Upcoming Subscribes" [isWithSeeAll]="true" [seeAllPath]="seeAllPath">
  <card-body class="body">
    @if (pairsItems().length) {
    <app-slider [items]="pairsItems()">
      @for (subscribes of pairsItems(); track subscribes) {
      <app-slide>
        <div class="card">
          @for (subscribe of subscribes; track subscribe.id) {
          <subscribe-card-item
            [subscribe]="subscribe"
            [isLast]="subscribe.id === subscribes.at(-1)?.id"
          />
          }
        </div>
      </app-slide>
      }
    </app-slider>
    } @else {
    <div class="data-placeholder">
      <span class="data-placeholder__icon" aria-hidden="true">🔄</span>
      <p>No upcoming subscriptions</p>
      <p>Add a subscription in the Subscriptions section</p>
    </div>
    }
  </card-body>
</dashboard-card>
