<dashboard-card
  title="Upcoming Subscribes"
  [isWithSeeAll]="true"
  [seeAllPath]="seeAllPath"
  [seeAllNavigation]="seeAllNavigation()"
>
  <card-body class="body">
    @if (isLoading()) {
    <div class="data-loading">
      <p-progress-spinner ariaLabel="Loading" />
    </div>
    } @else if (pairsItems().length) {
    <p-carousel
      [value]="pairsItems()"
      [numVisible]="1"
      [numScroll]="1"
      [responsiveOptions]="carouselResponsive"
      [showNavigators]="pairsItems().length > 1"
      [showIndicators]="pairsItems().length > 1"
      styleClass="dashboard-carousel"
    >
      <ng-template #item let-pair>
        <div class="carousel-slide card">
          @for (subscribe of pair; track subscribe.id) {
          <subscribe-card-item
            [subscribe]="subscribe"
            [isLast]="subscribe.id === pair.at(-1)?.id"
          />
          }
        </div>
      </ng-template>
    </p-carousel>
    } @else {
    <div class="data-placeholder">
      <div class="dash-empty-icon" aria-hidden="true">
        <app-icon prime="sync" [sizePx]="26" />
      </div>
      <p>No upcoming subscriptions</p>
      <p>
        @if (groupRoomId()) {
          Add a subscription in the Subscriptions tab
        } @else {
          Add a subscription in the Subscriptions section
        }
      </p>
    </div>
    }
  </card-body>
</dashboard-card>
