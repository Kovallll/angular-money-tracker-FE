<dashboard-card
  [title]="title"
  [isWithSeeAll]="true"
  [seeAllPath]="seeAllPath"
  [hideHeaderDivider]="true"
>
  <card-header class="header">
    <div class="segment-control" role="tablist" aria-label="Transaction type">
      @for (tab of tabs; track tab) {
      <button
        type="button"
        class="segment-control__item"
        [class.segment-control__item--active]="tabFilter() === tab"
        [attr.aria-selected]="tabFilter() === tab"
        role="tab"
        (click)="selectTab(tab)"
      >
        {{ tab }}
      </button>
      }
    </div>
  </card-header>
  <card-body class="body">
    @if (isLoading()) {
    <div class="data-loading">
      <p-progress-spinner ariaLabel="Loading" />
    </div>
    } @else if (currentItems().length) {
    <div class="transaction-list">
      @for (item of currentItems(); track item.id) {
      <div (contextmenu)="openContextMenu($event, item)" class="transaction-row">
        <transaction-card-item [item]="item" />
      </div>
      }
    </div>
    <context-menu-component
      #ctxMenu
      (onDelete)="handleDelete(selectedItem())"
      (onEdit)="handleEdit(selectedItem())"
    />
    } @else {
    <div class="data-placeholder">
      <span class="data-placeholder__icon" aria-hidden="true">📋</span>
      <p>No transactions</p>
    </div>
    }
  </card-body>
</dashboard-card>
