<div
  class="card"
  [class.card--has-desc]="descriptionText()"
  #txDescTip="matTooltip"
  [matTooltip]="descriptionText()"
  [matTooltipDisabled]="!descriptionText()"
  matTooltipShowDelay="250"
  matTooltipPosition="above"
  matTooltipClass="transaction-description-tooltip"
  (click)="onCardClick($event, txDescTip)"
>
  <div class="left-content">
    <div class="category-icon">
      <app-icon [icon]="categoryIcon()" [sizePx]="20" />
    </div>
    <div class="text">
      <p class="title">{{ item().title }}</p>
      <p class="category">{{ item().category }}</p>
      @if (item().groupCreatedByName) {
        <p class="added-by">Added by {{ item().groupCreatedByName }}</p>
      }
    </div>
  </div>
  <div class="right-content">
    <p class="amount">{{ item().amount | appCurrency }}</p>
    <p class="date">{{ item().date | date }}</p>
  </div>
</div>
