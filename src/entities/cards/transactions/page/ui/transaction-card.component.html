<div class="container">
  <controls [controlsProps]="controlsProps()" />
  <div class="header">
    <h2>Transactions</h2>
    <transaction-add-button />
  </div>
  <dashboard-card class="card">
    <card-body class="body">
      <ng-container class="table">
        <div class="segment-control" role="tablist" aria-label="Transaction type">
          @for (tab of tabs; track tab) {
            <button
              type="button"
              class="segment-control__item"
              [class.segment-control__item--active]="tabFilter() === tab"
              [attr.aria-selected]="tabFilter() === tab"
              role="tab"
              (click)="selectTab(tab)"
            >
              {{ tab }}
            </button>
          }
        </div>
        @if (isLoading()) {
          <p-progress-spinner />
        } @else {
          <transactions-list-view
            [dataSource]="transactionsForTable()"
            [displayedCells]="displayedCells()"
            [isEmpty]="isEmpty"
            [showActions]="true"
            (onEdit)="handleEdit($event)"
            (onDelete)="handleDelete($event)"
          />
        }
      </ng-container>
    </card-body>
  </dashboard-card>
  <pagination />
</div>
