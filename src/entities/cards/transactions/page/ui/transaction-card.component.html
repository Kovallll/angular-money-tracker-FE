<div class="container" [class.container--embedded]="embedded()">
  <header class="app-page-head" [class.app-page-head--compact]="embedded()">
    @if (!embedded()) {
      <div class="app-page-head__text">
        <h1 class="app-page-head__title">{{ 'page.transactions.title' | translate }}</h1>
        <p class="app-page-head__subtitle">
          {{ 'page.transactions.subtitle' | translate }}
        </p>
      </div>
    }
    <div class="app-page-head__actions">
      <transaction-add-button [groupRoomId]="groupRoomId()" />
    </div>
  </header>
  <controls [controlsProps]="controlsProps()" />
  <dashboard-card class="card">
    <card-body class="body">
      <ng-container class="table">
        <div class="segment-control" role="tablist" [attr.aria-label]="'dashboard.transactionType' | translate">
          @for (tab of tabs; track tab) {
          <button
            type="button"
            class="segment-control__item"
            [class.segment-control__item--active]="tabFilter() === tab"
            [attr.aria-selected]="tabFilter() === tab"
            role="tab"
            (click)="selectTab(tab)"
          >
            {{ ('tabs.' + tab.toLowerCase()) | translate }}
          </button>
          }
        </div>
        @if (isLoadingForView()) {
          <p-progress-spinner />
        } @else {
          <transactions-list-view
            [dataSource]="transactionsForTable()"
            [displayedCells]="displayedCells()"
            [isEmpty]="isEmpty"
            [showActions]="true"
            (onEdit)="handleEdit($event)"
            (onDelete)="handleDelete($event)"
          />
        }
      </ng-container>
    </card-body>
  </dashboard-card>
  <pagination />
</div>
