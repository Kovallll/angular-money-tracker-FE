<div class="container">
  <p class="section-desc">
    Configure how often analytics reports are automatically saved. Saved reports appear on the Statistics page.
  </p>
  <div class="field">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Save frequency</mat-label>
      <mat-select
        [value]="currentPeriodicity"
        (selectionChange)="onPeriodicityChange($event.value)"
        [disabled]="loading()"
      >
        @for (opt of periodicityOptions; track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <div class="field toggle-row">
    <span class="toggle-label">Automatically save analytics reports</span>
    <mat-slide-toggle
      [checked]="currentEnabled"
      (change)="onEnabledChange($event.checked)"
      [disabled]="loading()"
    />
  </div>
</div>
