<div class="container">
  <p class="section-desc">
    {{ 'settings.analyticsDescription' | translate }}
  </p>
  <div class="field">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'settings.saveFrequency' | translate }}</mat-label>
      <mat-select
        [value]="currentPeriodicity"
        (selectionChange)="onPeriodicityChange($event.value)"
        [disabled]="loading()"
        panelClass="analytics-settings-period-panel"
      >
        @for (opt of periodicityOptions; track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label | translate }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <div class="field toggle-row">
    <span class="toggle-label">{{ 'settings.autoSaveAnalyticsReports' | translate }}</span>
    <mat-slide-toggle
      [checked]="currentEnabled"
      (change)="onEnabledChange($event.checked)"
      [disabled]="loading()"
    />
  </div>
</div>
