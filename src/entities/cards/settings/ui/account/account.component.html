<div class="container">
  <div class="info">
    <div class="content">
      <p class="title">Name</p>
      <p class="name">{{ user()?.name ?? '—' }}</p>
    </div>
    <div class="content">
      <p class="title">Lastname</p>
      <p class="lastname">{{ user()?.lastname ?? '—' }}</p>
    </div>
    <div class="content">
      <p class="title">Email</p>
      <p class="email">{{ user()?.email ?? '—' }}</p>
    </div>
    <div class="content">
      <p class="title">Phone</p>
      <p class="phone">{{ user()?.phone ?? '—' }}</p>
    </div>
    <div class="actions">
      <div class="action-btn">
        <update-profile-button (updateClick)="openEditProfileDialog()" />
      </div>
      <div class="action-btn logout-fallback">
        <logout-button />
      </div>
    </div>
  </div>
  <div class="avatar-upload">
    <p class="title">Your Profile Picture</p>
    <div class="upload-frame">
      <label for="avatarInput" class="upload-label" [class.loading]="avatarLoading()">
        <span class="upload-label-text">{{
          user()?.avatar ? 'Change photo' : 'Upload your photo'
        }}</span>
        <span class="upload-icon">📷 +</span>
      </label>
      <div
        class="avatar-box"
        [class.has-photo]="user()?.avatar"
        (click)="
          user()?.avatar && !avatarLoading() ? openFullSize(avatarUrl(user()!.avatar!)) : null
        "
      >
        @if (user()?.avatar && !avatarLoadError()) {
          <img
            [src]="avatarUrl(user()!.avatar!)"
            alt="Avatar"
            class="avatar-img"
            (error)="avatarLoadError.set(true)"
          />
          @if (avatarLoading()) {
            <div class="avatar-overlay">
              <span class="avatar-loading-text">Uploading...</span>
            </div>
          }
        } @else {
          <app-icon prime="user" [sizePx]="20" iconClass="avatar-placeholder-icon" />
        }
      </div>
    </div>
    <input
      id="avatarInput"
      type="file"
      accept="image/*"
      hidden
      [disabled]="avatarLoading()"
      (change)="onFileSelected($event)"
    />
  </div>
</div>
