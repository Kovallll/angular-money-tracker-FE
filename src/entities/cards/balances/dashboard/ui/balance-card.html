<dashboard-card [title]="title" [isWithSeeAll]="true" [seeAllPath]="seeAllPath">
  <card-header class="header">
    <div class="header__balance">
      <p>{{ totalBalancePrimary() | appCurrency:currencyService.primaryCode() }}</p>
      <p class="secondary">
        {{ totalBalanceSecondary() | appCurrency:currencyService.secondaryCode() }}
      </p>
    </div>
    <p>All accounts</p>
  </card-header>
  <card-body class="body">
    @if (isLoading()) {
    <div class="data-loading">
      <p-progress-spinner ariaLabel="Loading" />
    </div>
    } @else if (cards().length) {
    <p-carousel
      [value]="cards()"
      [numVisible]="1"
      [numScroll]="1"
      [responsiveOptions]="carouselResponsive"
      [showNavigators]="cards().length > 1"
      [showIndicators]="cards().length > 1"
      styleClass="dashboard-carousel slider"
    >
      <ng-template #item let-card>
        <div class="carousel-slide">
          <balance-card-item [card]="card" />
        </div>
      </ng-template>
    </p-carousel>
    } @else {
    <div class="data-placeholder">
      <div class="dash-empty-icon" aria-hidden="true">
        <app-icon prime="wallet" [sizePx]="26" />
      </div>
      <p>No cards added</p>
      <p>Add a card to see balance</p>
    </div>
    }
  </card-body>
</dashboard-card>
