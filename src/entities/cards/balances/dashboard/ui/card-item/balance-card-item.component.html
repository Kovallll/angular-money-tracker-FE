<div class="card">
  <div class="left-side">
    <p>{{ card().cardName }}</p>
    <p>{{ card().cardNumber }}</p>
  </div>
  <div class="right-side">
    <img [src]="'mastercard-logo.png' | assetPath" alt="MasterCard logo" loading="lazy" />
    <p>{{ balancePrimary() | appCurrency: currencyService.primaryCode() }}</p>
    <p class="secondary">{{ balanceSecondary() | appCurrency: currencyService.secondaryCode() }}</p>
  </div>
</div>
