<article class="mini-card">
  <div class="mini-card__header">
    <p class="mini-card__title">{{ card().bankName || card().cardName }}</p>
    @if (card().isPrimary) {
      <span class="mini-card__badge">Default</span>
    }
  </div>

  <div class="mini-card__meta">
    <p class="mini-card__number">{{ card().cardNumber }}</p>
    <div class="mini-card__brand">
    @if (card().cardName === 'Visa') {
      <span class="card-logo card-logo--visa" aria-label="Visa" role="img">VISA</span>
    } @else {
      <img
        [src]="'mastercard-logo.png' | assetPath"
        alt="Mastercard"
        loading="lazy"
        class="card-logo"
      />
    }
    </div>
  </div>

  <div class="mini-card__balance">
    <p class="mini-card__amount">{{ balancePrimary() | appCurrency: currencyService.primaryCode() }}</p>
    <p class="mini-card__secondary">
      {{ balanceSecondary() | appCurrency: currencyService.secondaryCode() }}
    </p>
  </div>
</article>
