<article class="card" (click)="handleCheckDetails()">
  <div class="card__header">
    <span class="card__badge">{{ card().cardType }}</span>
    <div class="card__brand">
      @if (card().cardName === 'Visa') {
        <svg
          class="card-logo card-logo--visa"
          viewBox="0 0 60 20"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Visa"
          role="img"
        >
          <text
            x="0"
            y="15"
            font-family="Arial Black, Arial, sans-serif"
            font-size="14"
            font-weight="900"
            fill="currentColor"
          >
            VISA
          </text>
        </svg>
      } @else {
        <img
          [src]="'mastercard-logo.png' | assetPath"
          alt="Mastercard"
          loading="lazy"
          width="32"
          height="20"
          class="card-logo"
        />
      }
      <span class="card__name">{{ card().cardName }}</span>
    </div>
  </div>
  <div class="card__number" aria-label="Account number">
    <span class="card__number-value">{{ card().cardNumber }}</span>
    <span class="card__number-label">Account number</span>
  </div>
  <div class="card__balance">
    <span class="card__balance-label">Available balance</span>
    <span class="card__balance-primary">{{
      balancePrimary() | appCurrency: currencyService.primaryCode()
    }}</span>
    <span class="card__balance-secondary">{{
      balanceSecondary() | appCurrency: currencyService.secondaryCode()
    }}</span>
  </div>
  <footer class="card__footer">
    <button
      type="button"
      class="card__action"
      (click)="handleCheckDetails(); $event.stopPropagation()"
    >
      View details
    </button>
  </footer>
</article>
