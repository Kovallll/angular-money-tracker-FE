<div class="container">
  <div class="header">
    <h3 class="title">{{ title() }}</h3>
    @if(isWithSeeAll()) {
    <button type="button" class="see-all" (click)="onSeeAllClick()">
      {{ 'common.seeAll' | translate }}
      <app-icon material="keyboard_arrow_right" [sizePx]="20" />
    </button>
    }
  </div>
  <div class="content">
    <ng-content select="card-header"></ng-content>

    @if (cardHeader && !hideHeaderDivider()) {
    <divider color="tertiary" />
    }

    <ng-content select="card-body" class="body"></ng-content>
  </div>
</div>
