<div class="card">
  <div class="header">
    <div class="left-content">
      <div class="category-icon">
        <app-icon [icon]="category?.icon" />
      </div>
      <div class="text">
        <p class="category">{{ category?.title }}</p>
        <p class="cost">{{ displayTotalExpenses() | appCurrency }}</p>
      </div>
    </div>
    <div class="right-content">
      <div class="percents-block">
        <p class="percents">15%</p>
        <app-icon icon="arrow_upward" iconClass="icon" />
      </div>
      <p class="compare">Compare to last month</p>
    </div>
  </div>
  <div class="body">
    @if (expenses().length) {
      @for (expense of expenses(); track expense.id) {
        <expense-card-item [expense]="expense" />
      }
    } @else {
      <div class="data-placeholder">
        <span class="data-placeholder__icon" aria-hidden="true">📊</span>
        <p>No expenses in this category</p>
      </div>
    }
  </div>
</div>
