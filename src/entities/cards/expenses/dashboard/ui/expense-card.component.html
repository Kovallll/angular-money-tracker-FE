<dashboard-card [title]="'dashboard.expenses' | translate" [isWithSeeAll]="true" [seeAllPath]="seeAllPath">
  <card-body class="body">
    @if (isLoading()) {
      <div class="data-loading">
        <p-progress-spinner [ariaLabel]="'common.loading' | translate" />
      </div>
    } @else if (expenses().length) {
      @for (expense of expenses(); track expense.id) {
        <expense-card-item [expense]="expense" />
      }
    } @else {
      <div class="data-placeholder">
        <div class="dash-empty-icon" aria-hidden="true">
          <app-icon prime="chart-bar" [sizePx]="26" />
        </div>
        <p>{{ 'dashboard.noExpenses' | translate }}</p>
      </div>
    }
  </card-body>
</dashboard-card>
