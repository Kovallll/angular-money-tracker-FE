<div
  class="card"
  (click)="goToDetails()"
  role="button"
  tabindex="0"
  (keydown.enter)="goToDetails()"
  (keydown.space)="goToDetails()"
>
  <div class="left-content">
    <div class="category-icon">
      <app-icon [icon]="expense().category.icon" [sizePx]="30" />
    </div>
    <div class="text">
      <p class="category">{{ expense().category.title }}</p>
      <p class="cost">{{ expense().amount | appCurrency }}</p>
    </div>
  </div>
</div>
