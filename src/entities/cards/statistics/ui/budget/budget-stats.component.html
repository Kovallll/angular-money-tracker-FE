<dashboard-card [title]="title() | translate" [isWithSeeAll]="isWithSeeAll()" [seeAllPath]="seeAllPath()">
  <card-body class="body">
    @if (!fixedView()) {
      <div class="controls">
        <div class="select-wrapper">
          <button
            class="toggle"
            type="button"
            (click)="handleClickPrev()"
            [attr.aria-label]="'charts.previousPeriod' | translate"
          >
            <app-icon material="keyboard_arrow_left" [sizePx]="20" />
          </button>
          <select-component
            [options]="chartViewChoices()"
            [value]="currentView().value"
            (valueChange)="onValueChange($event)"
          />
          <button
            class="toggle"
            type="button"
            (click)="handleClickNext()"
            [attr.aria-label]="'charts.nextPeriod' | translate"
          >
            <app-icon material="keyboard_arrow_right" [sizePx]="20" />
          </button>
        </div>
      </div>
    }

    <div class="chart-wrap">
      @if (isLoading()) {
        <div class="chart-loading">
          <p-progress-spinner [ariaLabel]="'common.loading' | translate" strokeWidth="3" />
        </div>
      } @else if (hasChartData()) {
        <canvas
          class="chart"
          baseChart
          [data]="data()"
          [options]="options()"
          [type]="'bar'"
          [attr.aria-label]="'charts.budgetStatisticsChart' | translate"
        ></canvas>
      } @else {
        <div class="chart-placeholder">
          <div class="dash-empty-icon" aria-hidden="true">
            <app-icon prime="chart-bar" [sizePx]="26" />
          </div>
          <p>{{ 'charts.noData' | translate }}</p>
        </div>
      }
    </div>
  </card-body>
</dashboard-card>
