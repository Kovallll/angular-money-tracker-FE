<dashboard-card [title]="title()" [isWithSeeAll]="isWithSeeAll()" [seeAllPath]="seeAllPath()">
  <card-body class="body">
    @if (!fixedView()) {
      <div class="controls">
        <div class="select-wrapper">
          <button
            class="toggle"
            type="button"
            (click)="handleClickPrev()"
            aria-label="Previous period"
          >
            <app-icon material="keyboard_arrow_left" [sizePx]="20" />
          </button>
          <select-component
            [options]="chartViewChoices()"
            [value]="currentView().value"
            (valueChange)="onValueChange($event)"
          />
          <button class="toggle" type="button" (click)="handleClickNext()" aria-label="Next period">
            <app-icon material="keyboard_arrow_right" [sizePx]="20" />
          </button>
        </div>
      </div>
    }

    <div class="chart-wrap">
      @if (isLoading()) {
        <div class="chart-loading">
          <p-progress-spinner ariaLabel="Loading" strokeWidth="3" />
        </div>
      } @else if (hasChartData()) {
        <canvas
          class="chart"
          baseChart
          [data]="data()"
          [options]="options()"
          [type]="'bar'"
          aria-label="Budget statistics chart"
        ></canvas>
      } @else {
        <div class="chart-placeholder">
          <span class="chart-placeholder__icon" aria-hidden="true">📊</span>
          <p>No data</p>
        </div>
      }
    </div>
  </card-body>
</dashboard-card>
