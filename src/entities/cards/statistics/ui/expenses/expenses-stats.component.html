<dashboard-card [title]="title() | translate">
  <card-body class="body">
    <div class="chart-wrap">
      @if (isLoading()) {
        <div class="chart-loading">
          <p-progress-spinner [ariaLabel]="'common.loading' | translate" strokeWidth="3" />
        </div>
      } @else if (hasChartData()) {
        <canvas
          class="chart"
          baseChart
          [data]="data()"
          [options]="options()"
          [type]="'bar'"
          [attr.aria-label]="'charts.expensesStatisticsChart' | translate"
        ></canvas>
      } @else {
        <div class="chart-placeholder">
          <span class="chart-placeholder__icon" aria-hidden="true">📊</span>
          <p>{{ 'dashboard.noTransactions' | translate }}</p>
        </div>
      }
    </div>
  </card-body>
</dashboard-card>
