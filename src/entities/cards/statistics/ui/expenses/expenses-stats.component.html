<dashboard-card [title]="title()">
  <card-body class="body">
    <div class="chart-wrap">
      @if (isLoading()) {
        <div class="chart-loading">
          <p-progress-spinner ariaLabel="Loading" strokeWidth="3" />
        </div>
      } @else if (hasChartData()) {
        <canvas
          class="chart"
          baseChart
          [data]="data()"
          [options]="options()"
          [type]="'bar'"
          aria-label="Expenses statistics chart"
        ></canvas>
      } @else {
        <div class="chart-placeholder">
          <span class="chart-placeholder__icon" aria-hidden="true">📊</span>
          <p>No transactions</p>
        </div>
      }
    </div>
  </card-body>
</dashboard-card>
