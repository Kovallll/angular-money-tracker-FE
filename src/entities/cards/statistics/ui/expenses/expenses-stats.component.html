<dashboard-card [title]="title()">
  <card-body class="body">
    <div class="chart-wrap">
      <canvas
        class="chart"
        baseChart
        [data]="data()"
        [options]="options()"
        [type]="'bar'"
        aria-label="Expenses statistics chart"
      ></canvas>
    </div>
  </card-body>
</dashboard-card>
