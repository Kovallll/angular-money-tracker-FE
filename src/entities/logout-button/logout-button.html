<app-button
  [appearance]="iconOnly() ? 'ghost' : 'secondary'"
  [size]="iconOnly() ? 'md' : 'lg'"
  [fullWidth]="!iconOnly()"
  [customClass]="iconOnly() ? 'logout-btn--icon-only' : ''"
  [ariaLabel]="iconOnly() ? 'Sign out' : ''"
  (buttonClick)="logout()"
>
  <app-icon material="logout" [sizePx]="20" [iconClass]="iconOnly() ? '' : 'icon'" />
  @if (!iconOnly()) {
  <span>Logout</span>
  }
</app-button>
