<div class="dialog">
  <h2>Edit Goal</h2>

  <form class="app-modal-form" (ngSubmit)="onSave()">
    <div class="form-fields">
      <div class="field">
        <label for="title">Title</label>
        <input
          pInputText
          id="title"
          type="text"
          [(ngModel)]="data.title"
          placeholder="Enter goal title"
        />
      </div>

      <div class="field">
        <app-price-currency-field
          label="Target Budget"
          amountName="targetBudget"
          [(amount)]="targetBudget"
          [(currencyCode)]="currencyCode"
        />
      </div>

      <div class="field">
        <app-price-currency-field
          label="Goal Budget"
          amountName="goalBudget"
          [(amount)]="goalBudget"
          [showCurrency]="false"
        />
      </div>

      <div class="field">
        <label for="startDate">Start Date</label>
        <p-datepicker
          id="startDate"
          [(ngModel)]="data.startDate"
          dateFormat="yy-mm-dd"
          showIcon="true"
          appendTo="body"
        ></p-datepicker>
      </div>

      <div class="field">
        <label for="endDate">End Date</label>
        <p-datepicker
          id="endDate"
          [(ngModel)]="data.endDate"
          dateFormat="yy-mm-dd"
          showIcon="true"
          appendTo="body"
        ></p-datepicker>
      </div>
    </div>

    <div class="actions">
      <app-button appearance="danger" size="md" (buttonClick)="onDelete()">
        <i class="pi pi-trash"></i>
        Delete
      </app-button>

      <span class="spacer"></span>

      <app-button appearance="secondary" size="md" (buttonClick)="onCancel()">
        <i class="pi pi-times"></i>
        Cancel
      </app-button>

      <app-button appearance="primary" size="md" (buttonClick)="onSave()">
        <i class="pi pi-check"></i>
        Save
      </app-button>
    </div>
  </form>
</div>
