<app-modal-shell
  title="Edit Goal"
  [showDelete]="true"
  [showCancel]="true"
  [showSave]="true"
  [saveDisabled]="!!f.invalid || hasDateError() || hasBudgetError()"
  (closeRequest)="onCancel()"
  (deleteRequest)="onDelete()"
  (cancelRequest)="onCancel()"
  (saveRequest)="onSave()"
>
  <form #f="ngForm" class="app-modal-form" (ngSubmit)="onSave()">
    <div class="form-fields">
      <div class="field">
        <label for="title" class="label">Title</label>
        <input
          pInputText
          id="title"
          name="title"
          type="text"
          [(ngModel)]="data.title"
          placeholder="Enter goal title"
        />
      </div>

      <div class="field">
        <app-price-currency-field
          label="Target Budget"
          amountName="targetBudget"
          [(amount)]="targetBudget"
          [(currencyCode)]="currencyCode"
          [lockCurrency]="true"
        />
        <div class="error-slot">
          @if (hasBudgetError() && goalBudget > 0 && targetBudget > goalBudget) {
            <small class="error">Target must not exceed goal.</small>
          }
        </div>
      </div>

      <div class="field">
        <app-price-currency-field
          label="Goal Budget"
          amountName="goalBudget"
          [(amount)]="goalBudget"
          [showCurrency]="false"
        />
        <div class="error-slot">
          @if (hasBudgetError() && goalBudget <= 0) {
            <small class="error">Must be &gt; 0.</small>
          }
        </div>
      </div>

      <div class="field">
        <label for="categoryId" class="label">Category</label>
        <p-select
          inputId="categoryId"
          name="categoryId"
          [options]="categoryOptions"
          optionLabel="title"
          optionValue="id"
          [(ngModel)]="selectedCategoryId"
          placeholder="Select category"
          appendTo="body"
        >
          <ng-template let-item pTemplate="item">
            <div class="icon-row">
              <app-icon [icon]="item.icon" />
              <span>{{ item.title }}</span>
            </div>
          </ng-template>
        </p-select>
      </div>

      <div class="field">
        <label for="startDate" class="label">Start Date</label>
        <p-datepicker
          id="startDate"
          inputId="startDate"
          [(ngModel)]="data.startDate"
          name="startDate"
          dateFormat="yy-mm-dd"
          appendTo="body"
          panelStyleClass="subscription-datepicker-panel"
        ></p-datepicker>
      </div>

      <div class="field">
        <label for="endDate" class="label">End Date <span class="optional">(optional)</span></label>
        <p-datepicker
          id="endDate"
          inputId="endDate"
          [(ngModel)]="data.endDate"
          name="endDate"
          dateFormat="yy-mm-dd"
          appendTo="body"
          panelStyleClass="subscription-datepicker-panel"
        ></p-datepicker>
        <div class="error-slot">
          @if (hasDateError()) {
            <small class="error">End date must be after start date.</small>
          }
        </div>
      </div>
    </div>
  </form>
</app-modal-shell>
