<app-modal-shell
  [embedded]="true"
  [showCloseButton]="false"
  [showCancel]="true"
  [showSave]="true"
  saveLabel="Add"
  [saveDisabled]="!!cardForm.invalid"
  (cancelRequest)="close()"
  (saveRequest)="onSubmit(cardForm)"
>
  <form #cardForm="ngForm" (ngSubmit)="onSubmit(cardForm)" class="app-modal-form category-modal">
    <div class="form-fields form-fields--stack">
      <div class="field">
        <label for="categoryName">Category name&#42;</label>
        <input
          class="input"
          pInputText
          type="text"
          id="categoryName"
          placeholder="e.g. Groceries, Rent, Subscriptions"
          name="categoryName"
          [(ngModel)]="card.title"
          #categoryName="ngModel"
          [invalid]="categoryName.invalid && (categoryName.touched || cardForm.submitted)"
          required
        />
        <div class="error-slot">
          @if (categoryName.invalid && (categoryName.touched || cardForm.submitted)) {
            <small class="error">Category name is required.</small>
          }
        </div>
      </div>
      <div class="field field--icon">
        <span class="field-label-main">Icon</span>
        <category-icon-picker [(selectedIcon)]="card.icon" />
      </div>
    </div>
  </form>
</app-modal-shell>
