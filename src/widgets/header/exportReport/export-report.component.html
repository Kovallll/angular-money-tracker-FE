<button
  pButton
  type="button"
  (click)="openMenu($event)"
  [disabled]="isLoading()"
  class="export-btn"
  severity="primary"
  aria-label="Export report"
>
  <app-icon prime="download" [sizePx]="16" />
  <span class="p-button-label">{{ buttonLabel() }}</span>
</button>
<p-tieredMenu
  #menu
  [model]="menuItems"
  [popup]="true"
  appendTo="body"
  styleClass="export-report-menu"
></p-tieredMenu>

@if (showOverlay()) {
  <div class="export-overlay" aria-busy="true" aria-label="Export report">
    <div class="export-overlay__backdrop"></div>
    <div class="export-overlay__content">
      <p-progressSpinner styleClass="export-overlay__spinner" strokeWidth="4" ariaLabel="Loading" />
      <p class="export-overlay__title">Export report</p>
      <p class="export-overlay__hint">
        Preparation of data and charts. Do not close the page and wait for completion.
      </p>
    </div>
  </div>
}
