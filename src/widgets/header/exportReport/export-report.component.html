<button
  #exportTriggerBtn
  pButton
  type="button"
  (click)="openMenu($event)"
  [disabled]="isLoading()"
  class="export-btn"
  severity="primary"
  [attr.aria-label]="'export.exportReport' | translate"
>
  <app-icon prime="download" [sizePx]="18" />
  <span class="p-button-label">{{ buttonLabel() }}</span>
</button>
<p-tieredMenu
  #menu
  [model]="menuItems"
  [popup]="true"
  appendTo="body"
  styleClass="export-report-menu"
  (onShow)="onExportMenuShown()"
></p-tieredMenu>

@if (showOverlay()) {
  <div class="export-overlay" aria-busy="true" [attr.aria-label]="'export.exportReport' | translate">
    <div class="export-overlay__backdrop"></div>
    <div class="export-overlay__content">
      <p-progressSpinner
        styleClass="export-overlay__spinner"
        strokeWidth="4"
        [ariaLabel]="'common.loading' | translate"
      />
      <p class="export-overlay__title">{{ 'export.exportReport' | translate }}</p>
      <p class="export-overlay__hint">
        {{ 'export.preparingHint' | translate }}
      </p>
    </div>
  </div>
}
