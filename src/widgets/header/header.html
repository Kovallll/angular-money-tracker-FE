<div class="header">
  <div class="content header-user">
    <div class="user-hello">
      <h2 class="hello-text">{{ 'header.hello' | translate }} {{ user?.name }}</h2>
      <div class="date">
        <app-icon material="calendar_today" [sizePx]="20" />
        <p class="date-text">{{date}}</p>
      </div>
    </div>
    <div class="user-compact">
      @if (user) { @if (user.avatar && !avatarLoadError) {
      <img
        [src]="avatarUrl(user.avatar)"
        alt=""
        class="avatar-img"
        referrerpolicy="no-referrer"
        (error)="avatarLoadError = true"
      />
      } @else {
      <span class="avatar-placeholder" aria-hidden="true">
        <app-icon prime="user" [sizePx]="20" />
      </span>
      }
      <span class="user-name">{{ user.name }}</span>
      }
    </div>
  </div>
  <div class="content header-actions">
    <button
      type="button"
      class="header-quick-add-btn"
      (click)="openQuickAddTransaction()"
      [attr.aria-label]="'header.quickAddAria' | translate"
    >
      <app-icon material="add" [sizePx]="22" />
    </button>
    @if (!isUltraCompact()) {
      <div class="lang-switch" role="group" [attr.aria-label]="'header.language' | translate">
        <button
          type="button"
          class="lang-btn"
          [class.active]="i18n.currentLang() === 'ru'"
          (click)="switchLanguage('ru')"
        >
          RU
        </button>
        <button
          type="button"
          class="lang-btn"
          [class.active]="i18n.currentLang() === 'en'"
          (click)="switchLanguage('en')"
        >
          EN
        </button>
      </div>
      <app-currency-selector />
      <telegram-link />
      <notification />
      <export-report-button />
    } @else {
      <button
        #compactMoreButton
        type="button"
        class="compact-more-btn"
        (click)="toggleCompactMenu()"
        aria-label="More actions"
      >
        <app-icon material="more_horiz" [sizePx]="20" />
      </button>

      @if (compactMenuOpen()) {
        <div #compactMorePanel class="compact-more-panel">
          <div class="compact-more-panel__section compact-more-panel__section--top">
            <div class="lang-switch" role="group" [attr.aria-label]="'header.language' | translate">
              <button
                type="button"
                class="lang-btn"
                [class.active]="i18n.currentLang() === 'ru'"
                (click)="switchLanguage('ru')"
              >
                RU
              </button>
              <button
                type="button"
                class="lang-btn"
                [class.active]="i18n.currentLang() === 'en'"
                (click)="switchLanguage('en')"
              >
                EN
              </button>
            </div>
            <telegram-link />
            <notification />
          </div>
          <div class="compact-more-panel__section compact-more-panel__section--bottom">
            <app-currency-selector />
            <export-report-button />
          </div>
        </div>
      }
    }
  </div>
</div>
