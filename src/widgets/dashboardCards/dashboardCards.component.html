<div class="content">
  <div class="top-cards">
    <dash-balance-card class="balance-block" />
    <dash-goal-card class="goal-block" />
    <dash-subscribe-card class="subscribe-block" />
  </div>
  <div class="bottom-cards">
    <dash-transaction-card />
    <div class="columns-card">
      <div class="stats">
        <budget-statistic-card
          [fixedView]="fixedView()"
          [title]="'Week statistic'"
          [isWithSeeAll]="true"
          [seeAllPath]="seeAllPath"
        />
      </div>
      <dash-expense-card />
    </div>
  </div>
</div>
