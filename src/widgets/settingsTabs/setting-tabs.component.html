<dashboard-card>
  <card-body class="body">
    <div class="segment-control" role="tablist" [attr.aria-label]="'tabs.settingsSections' | translate">
      @for (tab of tabs; track tab) {
        <button
          type="button"
          class="segment-control__item"
          [class.segment-control__item--active]="selectedTab() === tab"
          [attr.aria-selected]="selectedTab() === tab"
          role="tab"
          (click)="selectTab(tab)"
        >
          {{ ('tabs.settings.' + tab.toLowerCase()) | translate }}
        </button>
      }
    </div>
    @switch (selectedTab()) {
      @case ('Account') {
        <settings-account [user]="user()" />
      }
      @case ('Security') {
        <settings-security />
      }
      @case ('Analytics') {
        <settings-analytics [user]="user()" />
      }
    }
  </card-body>
</dashboard-card>
