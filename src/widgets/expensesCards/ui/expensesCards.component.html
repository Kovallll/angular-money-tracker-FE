<div class="container">
  <p class="title">Expenses Breakdown</p>
  <div class="content">
    @if (hasAnyExpenses()) {
      @for (category of categories(); track category.id) {
        @if (category.expenses.length) {
          <expense-card [category]="category" />
        }
      }
    } @else {
      <div class="data-placeholder">
        <span class="data-placeholder__icon" aria-hidden="true">📊</span>
        <p>No expenses by category</p>
      </div>
    }
  </div>
</div>
