<section class="contrib" [attr.aria-label]="'rooms.contributions.aria' | translate">
  <h3 class="contrib__title">{{ 'rooms.contributions.title' | translate }}</h3>
  <p class="contrib__hint">{{ 'rooms.contributions.hint' | translate }}</p>
  @if (isPending()) {
    <div class="contrib__loading">
      <p-progress-spinner [ariaLabel]="'common.loading' | translate" strokeWidth="3" />
    </div>
  } @else if (!hasData()) {
    <div class="contrib__empty">{{ 'dashboard.noRoomTransactions' | translate }}</div>
  } @else {
    <div class="contrib__chart">
      <canvas
        baseChart
        [type]="'doughnut'"
        [data]="chartData()"
        [options]="chartOptions()"
      ></canvas>
    </div>
  }
</section>
