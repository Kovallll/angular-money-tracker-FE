<div class="container">
  <div class="logo-block">
    <app-logo size="md" />
  </div>
  <div class="controls">
    <mat-form-field appearance="outline" class="input-wrapper">
      <mat-label>Email</mat-label>
      <input
        type="email"
        matInput
        [formControl]="email"
        [errorStateMatcher]="matcher"
        placeholder="Enter email"
        class="input"
      />
      @if(email.invalid && email.touched) {
      <mat-error> {{ getErrorEmailMessage() }} </mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline" class="input-wrapper">
      <mat-label>Password</mat-label>
      <input
        type="password"
        matInput
        [formControl]="password"
        [errorStateMatcher]="matcher"
        placeholder="Enter password"
        class="input"
      />
      @if (password.invalid && password.touched) {
      <mat-error> {{ getErrorPasswordMessage() }} </mat-error>
      }
    </mat-form-field>
  </div>
  @if (loading) {
  <div class="loading-block">
    <span class="loading-text">Signing in...</span>
    <mat-spinner diameter="48" class="loading-spinner"></mat-spinner>
  </div>
  } @else {
  <div class="button-wrap">
    <app-button appearance="primary" size="lg" [fullWidth]="true" (buttonClick)="login()"
      >Login</app-button
    >
  </div>
  }
  <p class="text">
    Don't have an account?
    <a routerLink="/signup" (click)="signup()" class="link">Sign up</a>
  </p>
</div>
