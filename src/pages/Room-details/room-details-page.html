<section class="room-details" *ngIf="room() as roomData; else loadingTpl">
  <a [routerLink]="['/', routePaths.ROOMS]" class="room-back">
    <app-icon prime="arrow-left" [sizePx]="20" />
    <span>Rooms</span>
  </a>

  <header class="app-page-head app-page-head--tight">
    <div class="app-page-head__text">
      <h1 class="app-page-head__title">{{ roomData.name }}</h1>
      <p class="app-page-head__subtitle" *ngIf="roomData.description?.trim()">{{ roomData.description }}</p>
    </div>
  </header>

  <p class="room-error" *ngIf="error()">{{ error() }}</p>

  <nav class="room-tabs" role="tablist" aria-label="Room sections">
    <button
      type="button"
      *ngFor="let t of tabDefs"
      class="room-tab"
      [class.room-tab--active]="activeTab() === t.id"
      [attr.aria-selected]="activeTab() === t.id"
      (click)="setTab(t.id)"
    >
      {{ t.label }}
    </button>
  </nav>

  <div class="room-panels" [ngSwitch]="activeTab()">
    <div class="room-embed" *ngSwitchCase="'overview'">
      <dashboard-cards [groupRoomId]="roomId()" />
    </div>

    <div class="room-embed" *ngSwitchCase="'transactions'">
      <transaction-widget [groupRoomId]="roomId()" [embedded]="true" />
    </div>

    <div class="room-embed" *ngSwitchCase="'categories'">
      <categories-cards [groupRoomId]="roomId()" [embedded]="true" />
    </div>

    <div class="room-embed" *ngSwitchCase="'goals'">
      <goals-cards [groupRoomId]="roomId()" [embedded]="true" />
    </div>

    <div class="room-embed" *ngSwitchCase="'subscriptions'">
      <subscribe-table [groupRoomId]="roomId()" [embedded]="true" />
    </div>

    <ng-container *ngSwitchCase="'members'">
      <section class="room-card">
        <div class="room-card__head">
          <h2 class="room-card__title room-card__title--inline">Members</h2>
          <app-button appearance="primary" size="sm" type="button" (buttonClick)="openInviteDialog()">
            <app-icon prime="link" [sizePx]="18" />
            Create invite
          </app-button>
        </div>
        <div class="room-list">
          <div class="room-list__row room-list__row--members" *ngFor="let member of roomData.members">
            <div>
              <strong class="room-list__primary">{{ member.name }} {{ member.lastname || '' }}</strong>
              <p class="room-muted">{{ member.email }}</p>
            </div>
            <div class="room-member-actions">
              <span class="room-role">{{ member.role }}</span>
              <app-button
                *ngIf="member.role === 'member'"
                appearance="secondary"
                size="sm"
                type="button"
                (buttonClick)="updateRole(member.userId, 'admin')"
              >
                Make admin
              </app-button>
              <app-button
                *ngIf="member.role === 'admin'"
                appearance="secondary"
                size="sm"
                type="button"
                (buttonClick)="updateRole(member.userId, 'member')"
              >
                Make member
              </app-button>
              <app-button
                *ngIf="member.role !== 'owner'"
                appearance="outline"
                size="sm"
                type="button"
                (buttonClick)="removeMember(member.userId)"
              >
                Remove
              </app-button>
            </div>
          </div>
        </div>
        <div class="room-token" *ngIf="createdInviteToken()">
          <span class="room-token__label">Invite token</span>
          <code class="room-token__value">{{ createdInviteToken() }}</code>
        </div>
      </section>
    </ng-container>
  </div>
</section>

<p-dialog
  header="Create invite"
  [visible]="inviteDialogVisible()"
  (visibleChange)="onInviteDialogVisibleChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="rooms-dialog"
>
  <app-modal-shell
    [embedded]="true"
    [showCloseButton]="false"
    [showCancel]="true"
    [showSave]="true"
    saveLabel="Generate token"
    [saveDisabled]="!inviteHoursValid() || isCreatingInvite()"
    [saveLoading]="isCreatingInvite()"
    (cancelRequest)="closeInviteDialog()"
    (saveRequest)="createInvite()"
  >
    <form class="app-modal-form" (ngSubmit)="$event.preventDefault()">
      <div class="form-fields form-fields--stack">
        <div class="field form-field--full">
          <label for="roomInviteHours">Expires in (hours)</label>
          <input
            pInputText
            type="number"
            name="inviteHours"
            min="1"
            max="8760"
            id="roomInviteHours"
            placeholder="72"
            [ngModel]="inviteHours()"
            (ngModelChange)="onInviteHoursInput($event)"
          />
          <p class="room-invite-hint">Between 1 and 8760 hours (1 year).</p>
        </div>
      </div>
    </form>
  </app-modal-shell>
</p-dialog>

<ng-template #loadingTpl>
  <div class="room-loading">
    <p>Loading room…</p>
  </div>
</ng-template>
