<div class="container">
  <header class="app-page-head">
    <div class="app-page-head__text">
      <h1 class="app-page-head__title">Statistics overview</h1>
      <p class="app-page-head__subtitle">
        Track your budget, expenses, goals and category analytics in a single place.
      </p>
    </div>
  </header>

  <div class="segment-control" role="tablist" aria-label="Statistics view">
    <button
      type="button"
      class="segment-control__item"
      [class.segment-control__item--active]="statsView() === 'charts'"
      [attr.aria-selected]="statsView() === 'charts'"
      role="tab"
      (click)="setStatsView('charts')"
    >
      Charts
    </button>
    <button
      type="button"
      class="segment-control__item"
      [class.segment-control__item--active]="statsView() === 'reports'"
      [attr.aria-selected]="statsView() === 'reports'"
      role="tab"
      (click)="setStatsView('reports')"
    >
      Reports
    </button>
  </div>

  @if (statsView() === 'charts') {
  <main class="cards-grid">
    <section
      id="budget"
      class="cards-grid__item cards-grid__item--wide"
      aria-label="Budget statistics"
    >
      <budget-statistic-card />
    </section>

    <section id="expenses" class="cards-grid__item" aria-label="Expenses statistics">
      <expenses-statistic-card />
    </section>

    <section id="goals" class="cards-grid__item" aria-label="Goals statistics">
      <goals-statistic-card title="Goals" />
    </section>

    <section
      id="category"
      class="cards-grid__item cards-grid__item--full"
      aria-label="Category analytics and breakdown"
    >
      <category-analitics view="row" />
    </section>
  </main>
  } @else {
  <main class="cards-grid">
    <section
      id="saved-reports"
      class="cards-grid__item cards-grid__item--full"
      aria-label="Saved analytics reports"
    >
      <app-saved-reports />
    </section>
  </main>
  }
</div>
